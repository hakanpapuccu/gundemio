<!DOCTYPE html>

<html class="light" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#ec5b13",
            "background-light": "#f8f6f6",
            "background-dark": "#221610",
          },
          fontFamily: {
            "display": ["Public Sans"],
            "sans": ["Public Sans", "sans-serif"]
          },
          borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
        },
      },
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light font-sans antialiased text-background-dark">
<!-- Onboarding Screen 1 -->
<!-- Note: Shared TopAppBar/BottomNavBar excluded as per "Explicit Exclusions" rule for Onboarding flows -->
<div class="flex flex-col min-h-screen w-full max-w-md mx-auto bg-background-light overflow-hidden">
<!-- Top Progress/Skip Action -->
<div class="flex items-center justify-end p-6">
<button class="text-background-dark/60 text-sm font-medium hover:text-primary transition-colors">
        Atla
      </button>
</div>
<!-- Main Content Area -->
<div class="flex-1 flex flex-col items-center justify-center px-8 text-center">
<!-- Illustration Container -->
<div class="w-full aspect-square mb-12 relative flex items-center justify-center bg-primary/5 rounded-xl">
<div class="w-64 h-64 bg-center bg-no-repeat bg-contain" data-alt="Minimalist editorial graphic showing a grid of abstract newspaper layouts and digital interfaces floating in a clean organized composition with orange accents" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDU8whvfmsdFKj4YwOxOez7jNCvSwcfTI4cEmSSS5FxhNrbEhFXydwO5rnCEJcsCdP6QoxwBpi06gFXbUCs05wK04xkijXpCkwVUPZT15GUbvyAqA3KRIoencFWqAR-8DTl1a2_lHsSX8HVFuEzUdnDdrkwLFh3ATE1FG0DHHgkQDNptfIKCzqs5zQ3PU-JFZTMnTGQT9F-lGKyCVEVHL_gB9r9OCWfFi13pEBkE6e5iCxfYLWh6iv9YBwPu9hLethodmZv7fpEBnE");'>
</div>
</div>
<!-- Text Content -->
<h1 class="text-3xl font-bold leading-tight tracking-tight text-background-dark mb-4">
        Tüm haber kaynakları tek yerde
      </h1>
<p class="text-base font-normal leading-relaxed text-background-dark/70">
        Yüzlerce güvenilir kaynaktan gelen haberleri tek bir akışta toplayın.
      </p>
</div>
<!-- Bottom Controls -->
<div class="p-8 space-y-8">
<!-- Page Indicator Dots -->
<div class="flex items-center justify-center gap-2">
<div class="h-2 w-6 rounded-full bg-primary transition-all"></div>
<div class="h-2 w-2 rounded-full bg-primary/20"></div>
<div class="h-2 w-2 rounded-full bg-primary/20"></div>
</div>
<!-- Action Button -->
<div class="flex flex-col gap-3">
<button class="w-full bg-primary text-white font-bold py-4 rounded-xl flex items-center justify-center gap-2 hover:opacity-90 transition-opacity">
<span>Sonraki</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
</div>
</body></html>
