<!DOCTYPE html>

<html class="light" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&amp;family=Playfair+Display:wght@700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"],
                        "serif-premium": ["Playfair Display", "serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light font-display antialiased">
<!-- Splash Screen Container -->
<div class="relative flex h-screen w-full flex-col items-center justify-between bg-background-light px-6 py-16 overflow-hidden">
<!-- Decorative subtle background element -->
<div class="absolute top-[-10%] right-[-10%] w-64 h-64 bg-primary/5 rounded-full blur-3xl"></div>
<div class="absolute bottom-[-5%] left-[-5%] w-80 h-80 bg-primary/5 rounded-full blur-3xl"></div>
<!-- Middle Content: Logo & Name -->
<div class="flex flex-col items-center justify-center flex-grow space-y-6">
<!-- Minimalist Newspaper/Link Icon -->
<div class="relative flex items-center justify-center w-24 h-24 rounded-2xl bg-white shadow-sm border border-neutral-100">
<span class="material-symbols-outlined text-primary text-5xl" data-icon="newspaper">newspaper</span>
<!-- Small Link sub-icon overlay to represent the 'io' aspect -->
<div class="absolute -bottom-1 -right-1 bg-primary p-1.5 rounded-lg border-2 border-background-light shadow-md">
<span class="material-symbols-outlined text-white text-base" data-icon="link">link</span>
</div>
</div>
<!-- Brand Name in Premium Serif -->
<div class="text-center">
<h1 class="font-serif-premium text-5xl font-bold tracking-tight text-neutral-900">
                    Gündemio
                </h1>
<p class="mt-2 text-neutral-500 font-medium tracking-[0.2em] text-xs uppercase">
                    Haberin Dijital Merkezi
                </p>
</div>
</div>
<!-- Bottom Content: Loading & Credits -->
<div class="w-full max-w-xs flex flex-col items-center gap-6">
<!-- Subtle Loading Indicator -->
<div class="w-full space-y-3">
<div class="flex justify-between items-end">
<p class="text-neutral-400 text-xs font-medium">Gündem güncelleniyor...</p>
<p class="text-primary text-xs font-bold">30%</p>
</div>
<div class="w-full h-1 bg-neutral-200 rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full" style="width: 30%;"></div>
</div>
</div>
<!-- Quality Badge -->
<div class="flex items-center gap-2 opacity-40">
<span class="material-symbols-outlined text-sm" data-icon="verified">verified</span>
<span class="text-[10px] font-bold tracking-widest uppercase">Güvenilir Kaynak</span>
</div>
</div>
</div>
<!-- Hidden Header Image Shared Component as requested but styled for context (excluded from main view but preserved in structure) -->
<div class="hidden">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-[#240f1b] dark group/design-root overflow-x-hidden" style='font-family: "Public Sans", "Noto Sans", sans-serif;'>
<div class="@container">
<div class="@[480px]:px-4 @[480px]:py-3">
<div class="w-full bg-center bg-no-repeat bg-cover flex flex-col justify-end overflow-hidden bg-[#240f1b] @[480px]:rounded-xl min-h-[218px]" data-alt="abstract journalistic background with newspaper textures and warm orange accents representing modern news media" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuADKcnggbEuTbLdfsOhfFCPt7II81OwG73zqzimQwdv6_wWgPx4S0xQxBfkxCBiOV3w_UMmsOx5RXx0tunRu_B3-oFqZj360mPHSXvMjuNSTTYSWT_TmGWfatrpyXKk7f1VgaHS3i2lgmDKPzQtksK_iwMyMVqJ0ImWwhqSL9UBEz0hC3QlGknsc3VQJE9eNi_fOUDA-e0kdMWP9016sdh4sLnWHQl2UIfyxGGI8jLUhqdp6GPeDL3jYUciUZBMsfkzhoGPxLRWQ8Y");'>
</div>
</div>
</div>
<h1 class="text-white tracking-light text-[32px] font-bold leading-tight px-4 text-center pb-3 pt-6">Gündemio</h1>
<div class="flex flex-col gap-3 p-4">
<div class="flex gap-6 justify-between"><p class="text-white text-base font-medium leading-normal">Loading latest news...</p></div>
<div class="rounded bg-[#6b2e50]"><div class="h-2 rounded bg-[#ff8bcb]" style="width: 30%;"></div></div>
</div>
<div class="h-5 bg-[#240f1b]"></div>
</div>
</div>
</body></html>
